<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Página não encontrada | R Street</title>
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#0a0a0a;color:#fff;font-family:Inter,Arial,sans-serif}
  main{width:min(580px,100%);text-align:center}
  .logo{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:5px;color:#fff;text-decoration:none}
  .logo span,.code{color:#c8a96e}
  .code{font-family:'Bebas Neue',sans-serif;font-size:clamp(90px,22vw,160px);line-height:.9;margin:46px 0 10px}
  h1{font-family:'Bebas Neue',sans-serif;font-size:38px;letter-spacing:1px;margin:0 0 12px}
  p{color:#aaa;line-height:1.6;margin:0 auto 28px;max-width:460px}
  .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .actions a{min-height:44px;padding:12px 18px;border:1px solid #c8a96e;border-radius:4px;color:#0a0a0a;background:#c8a96e;text-decoration:none;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px}
  .actions a.secondary{color:#fff;background:transparent;border-color:#333}
</style>
</head>
<body>
<main>
  <a class="logo" href="/catalogo.html">R<span>.</span>Street</a>
  <div class="code">404</div>
  <h1>Essa página não foi encontrada</h1>
  <p>O endereço pode ter mudado. Volte ao catálogo ou acompanhe um pedido existente.</p>
  <div class="actions">
    <a href="/catalogo.html">Abrir catálogo</a>
    <a class="secondary" href="/acompanhar.html">Acompanhar pedido</a>
  </div>
</main>
</body>
</html>
